services:
  - type: web
    name: gdpr-audit
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_CONFIG
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gdpr_audit
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: gdpr_audit
    databaseName: gdpr_audit
    user: gdpr_user
