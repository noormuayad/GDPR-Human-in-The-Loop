{% extends "base.html" %}

{% block title %}Sign In — GDPR Audit{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 4rem); display: flex; align-items: center; justify-content: center; padding: 2rem 0;">
    <div style="width: 100%; max-width: 380px; animation: fadeUp 0.5s ease both;">

        <!-- Logo mark -->
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <div style="
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 52px; height: 52px;
                background: var(--accent-glow);
                border: 1px solid rgba(59,130,246,0.3);
                border-radius: var(--radius);
                font-size: 22px;
                color: var(--accent-blue);
                margin-bottom: 16px;
            ">
                <i class="bi bi-shield-check"></i>
            </div>
            <h1 style="font-size: 20px; font-weight: 600; letter-spacing: -0.03em; margin: 0 0 6px; color: var(--text-primary);">
                GDPR<span style="color: var(--accent-blue);">Audit</span>
            </h1>
            <p style="font-size: 13px; color: var(--text-muted); margin: 0;">
                Sign in to access your audit workspace
            </p>
        </div>

        <!-- Card -->
        <div class="card" style="border-color: var(--border);">
            <div class="card-body" style="padding: 28px;">
                <form method="POST">
                    <div style="margin-bottom: 18px;">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Enter your username" required autofocus>
                    </div>

                    <div style="margin-bottom: 24px;">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 10px;">
                        <i class="bi bi-box-arrow-in-right"></i> Sign In
                    </button>
                </form>
            </div>
        </div>

        <!-- Footer note -->
        <p style="text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 20px;">
            Access restricted to authorized auditors only.
        </p>

    </div>
</div>
{% endblock %}
